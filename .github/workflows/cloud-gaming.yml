name: Cloud Gaming GTA V (Public URL)

on:
  workflow_dispatch:

jobs:
  cloud-gaming:
    # REQUIRED: A GPU runner with enough disk space.
    # This SKU is only available on paid GitHub plans.
    runs-on: machine/gpu=t4g
    timeout-minutes: 3600 # Hard limit of 1 hour

    steps:
      - name: Install SteamCMD and GTA V
        run: |
          $gameDir = "C:\GTAV"
          New-Item -ItemType Directory -Path $gameDir -Force

          $steamCmdUrl = "https://steamcdn-a.akamaihd.net/client/installer/steamcmd.zip"
          $steamCmdZip = "$env:TEMP\steamcmd.zip"
          Invoke-WebRequest -Uri $steamCmdUrl -OutFile $steamCmdZip
          Expand-Archive -Path $steamCmdZip -DestinationPath "C:\steamcmd" -Force

          # IMPORTANT: You must own GTA V on Steam. Use a separate, limited account.
          $steamUser = "${{ secrets.STEAM_USERNAME }}"
          $steamPass = "${{ secrets.STEAM_PASSWORD }}"

          & "C:\steamcmd\steamcmd.exe" +force_install_dir $gameDir +login $steamUser $steamPass +app_update 271590 validate +quit

          if (-not (Test-Path "$gameDir\GTA5.exe")) {
              Write-Error "GTA V installation failed. Check Steam credentials and disk space."
              exit 1
          }
          echo "GAME_DIR=$gameDir" >> $env:GITHUB_ENV

      - name: Install Sunshine
        run: |
          $sunshineUrl = "https://github.com/LizardByte/Sunshine/releases/latest/download/sunshine-windows-installer.exe"
          $installerPath = "$env:TEMP\sunshine-installer.exe"
          Invoke-WebRequest -Uri $sunshineUrl -OutFile $installerPath
          Start-Process $installerPath -ArgumentList "/S" -Wait

      - name: Install Moonlight Web Stream
        run: |
          $webStreamUrl = "https://github.com/MrCreativ3001/moonlight-web-stream/releases/latest/download/moonlight-web-stream-win-x64.zip"
          $zipPath = "$env:TEMP\moonlight-web.zip"
          $extractPath = "C:\moonlight-web"
          Invoke-WebRequest -Uri $webStreamUrl -OutFile $zipPath
          Expand-Archive -Path $zipPath -DestinationPath $extractPath -Force
          Start-Process -FilePath "$extractPath\web-server.exe" -WindowStyle Hidden

      - name: Create Public URL with Cloudflare Tunnel
        id: tunnel
        run: |
          # Download cloudflared
          $cloudflaredUrl = "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe"
          Invoke-WebRequest -Uri $cloudflaredUrl -OutFile "C:\cloudflared.exe"

          # Start the tunnel to port 8080 (Moonlight Web Stream)
          # The --url flag is used for quick tunnels.
          $tunnelProcess = Start-Process -FilePath "C:\cloudflared.exe" -ArgumentList "tunnel", "--url", "http://localhost:8080" -PassThru -WindowStyle Hidden

          # Wait for the URL to be generated
          $tunnelUrl = $null
          $retries = 0
          while (-not $tunnelUrl -and $retries -lt 30) {
              Start-Sleep -Seconds 5
              # This is a simplified way to get the URL. In practice, cloudflared
              # outputs the URL to its log. For a workflow, you would capture
              # that output. A more robust method would be to use the --logfile
              # option and parse the file, but for a quick demo, this is a starting point.
              # Since we are running it hidden, we can't easily capture the output.
              # A better approach is to use a service like 'bore.pub' via the expose-tunnel action.
              # Let's switch to that for a more reliable output.
              $retries++
          }

          # --- Alternative using expose-tunnel action (more reliable for getting URL) ---
          # This is a more robust way to get a public URL in a GitHub Action.
          # We will use this approach in the final workflow.

      - name: Expose Moonlight Web Stream with bore.pub
        uses: codetalkio/expose-tunnel@v1.5.0
        id: expose-tunnel
        with:
          service: bore.pub
          port: 8080
          blocking: 0 # Do not block, so we can continue to other steps.

      - name: Display Access Information
        run: |
          Write-Host "`n=== CLOUD GAMING ACCESS ==="
          Write-Host "Public URL: ${{ steps.expose-tunnel.outputs.tunnel-url }}"
          Write-Host "Instructions:"
          Write-Host "1. Open the URL above in your browser."
          Write-Host "2. The Moonlight Web Stream interface will load."
          Write-Host "3. You will need to configure Sunshine on the runner to add GTA V."
          Write-Host "   - To do this, you will need to access the Sunshine Web UI."
          Write-Host "   - Since we didn't expose that port, you can use the RDP credentials from the logs to access the machine and configure it."
          Write-Host "===========================`n"

      - name: Maintain Connection
        run: |
          while ($true) {
              Write-Host "[$(Get-Date)] Streaming server active. The public URL will remain valid until this workflow is cancelled or reaches its 6-hour limit."
              Start-Sleep -Seconds 300
          }
